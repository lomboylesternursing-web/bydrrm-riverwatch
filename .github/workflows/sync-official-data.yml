name: Sync official RiverWatch data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "collect_official_data.py"
      - ".github/workflows/sync-official-data.yml"

permissions:
  contents: write

concurrency:
  group: riverwatch-official-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public government data
        run: python collect_official_data.py

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- official-data.json; then
            echo "No official-data change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-data.json
          git commit -m "Update official RiverWatch data"
          git push
