<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYDRRM RiverWatch v0.4</title>
<meta name="theme-color" content="#07111f">
<style>
html,body{margin:0;background:#07111f;color:#edf6ff;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading b{font-size:22px}.loading span{display:block;margin-top:8px;color:#8ca7bf;line-height:1.5}
</style>
</head>
<body>
<div class="loading"><div><b>🌊 BYDRRM RiverWatch v0.4</b><span>Loading monitoring dashboard & Posting Studio…</span></div></div>
<script>
(async()=>{
  try{
    const names=["part01.b64","part02.b64","part03a.b64","part03b.b64","part04a.b64","part04b1.b64","part04b2.b64","part05.b64","part06.b64","part07.b64"];
    const texts=await Promise.all(names.map(n=>fetch("./"+n+"?v=4",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(n+" returned "+r.status);return r.text()})));
    const arrays=texts.map(t=>{
      const bin=atob(t.trim());
      const a=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
      return a;
    });
    const total=arrays.reduce((n,a)=>n+a.length,0);
    const joined=new Uint8Array(total);
    let off=0;
    for(const a of arrays){joined.set(a,off);off+=a.length}
    let html=new TextDecoder("utf-8").decode(joined);
    html=html.replace("<head>","<head><base href='../'>");
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><div><b>RiverWatch v0.4 could not load.</b><span>'+String(e)+'</span></div></div>';
  }
})();
</script>
</body>
</html>
